apiVersion: apps/v1
kind: Deployment
metadata:
  name: axanth-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: axanth-app
  template:
    metadata:
      labels:
        app: axanth-app
    spec:
      containers:
        - name: django
          image: axanth/axanth_base_image:latest
          ports:
            - containerPort: 8000
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: app.settings
          command: ["python"]
          args: ["manage.py", "runserver", "0.0.0.0:8000"]