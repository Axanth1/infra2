apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: duepilot-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.duepilot.gr
        - duepilot.gr
      secretName: www-duepilot-tls
  rules:
    - host: duepilot.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redirect-service
                port:
                  number: 80
    - host: www.duepilot.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: duepilot-service
                port:
                  number: 80